# Copy to cameras.yaml (git-ignored) and put in your cameras' real addresses.
# A Tapo camera needs only its IP: the RTSP URL is built from it, using the credentials in
# $CAMERA_USER and $CAMERA_PASS (the Camera Account set in the Tapo app) and /stream1.
# 192.0.2.x is a documentation range.
# Where the cameras are: SpeciesNet drops species not found there. See the README for `allowlist`.
site:
  country: USA
  admin1_region: CA
  # Real-time alerts: a sighting of any of these species/groups sends a text (email->SMS).
  # Delivery address goes in the git-ignored credentials as SMS_ALERT_TO (e.g.
  # 15551234567@txt.att.net for AT&T). Leave empty for no alerts.
  alert_species: [coyote, owl, fox]
cameras:
  - name: east_fence
    label: Back fence, east
    host: 192.0.2.10
    aliases: ["east fence"]   # extra names to match in questions (loose: case/spacing ignored)
    watermark: fe             # tiny label stamped on this camera's thumbnails
  - name: west_fence
    label: Back fence, west
    host: 192.0.2.11
    # Analysis crop (tier 2): run inference only on this region [x, y, w, h] of the frame —
    # cheaper, and nothing outside is detected. Static; changing it re-learns this camera's
    # scenery. (Independent of motion_mask, which gates tier 1.)
    roi: [0.0, 0.2, 1.0, 0.6]
  - name: backyard
    label: Backyard
    host: 192.0.2.12
    tags: [wide_view]       # long-range view: tile the frame so far animals aren't lost
    tile_rows: 2            # analysis tiling grid (0 = the wide_view default of 2x2)
    tile_cols: 2            # rows*cols <= 1 means whole frame only (no tiling)
    analysis_width: 1920    # scale the analysis frame to this width (0 = native); sharper far-animal crops
    # Vary settings by local time of day (wraps midnight). Each entry may override
    # tile_rows, tile_cols, and detect_every_seconds. Quiet nights cost less:
    when:
      - { hours: "22:00-06:00", tile_rows: 1, tile_cols: 1, detect_every_seconds: 2, analysis_width: 1280 }
  - name: east_deck
    label: Deck, east
    host: 192.0.2.13
    # Tier-1 motion mask: ignore change in dead/noisy regions (a swaying tree, a street) so it
    # never wakes the detector. [x, y, w, h] as fractions of the frame; repeatable. Optionally
    # motion_roi: [x, y, w, h] to count motion only inside one rectangle.
    motion_mask: [[0.0, 0.0, 1.0, 0.25]]   # ignore the top quarter (sky / neighbour's roof)
    # Watch only during these local hours (wraps midnight, so this is night-only). Blank /
    # omitted means always. Pausing low-value cameras by day frees the detector for the rest.
    active: "19:00-07:00"
  # Anything else goes in `source`: a video file (handy for testing away from home), or a
  # full URL for a non-Tapo camera, where ${VAR} is expanded from the environment.
  # - name: test_clip
  #   label: Recorded clip
  #   source: ~/Movies/some_clip.mp4

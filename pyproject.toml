[project]
name = "camera-mcp"
version = "0.1.0"
description = "MCP server over home IP cameras: live snapshots, and a monitor that logs animal visits."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2.3",
    "opencv-python-headless>=4.9",  # image ops only; video comes from the ffmpeg binary
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Animal identification in the monitor. SpeciesNet supports Python < 3.14 (and pins numpy < 2
# on Intel Macs); without it the monitor watches for motion only.
detect = ["speciesnet>=5.0.5; python_version < '3.14'"]

[project.scripts]
camera-mcp = "camera_mcp.server:main"
camera-monitor = "camera_mcp.monitor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

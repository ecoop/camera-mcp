[project]
name = "camera-mcp"
version = "0.1.0"
description = "MCP server over home IP cameras: live snapshots, and a monitor that logs animal visits."
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2.3",
    "opencv-python-headless>=4.9",  # image ops only; video comes from the ffmpeg binary
    "pyyaml>=6",
    "certifi",  # a current CA bundle for verifying mail-server TLS (Python default can miss valid chains)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Read-only web dashboard (camera_mcp.web). Starlette already comes in via mcp; this adds the server.
web = ["uvicorn>=0.30"]
# The dashboard's ask box (camera_mcp.ask): plain-English questions answered by Claude over the
# read-only history tools. Needs ANTHROPIC_API_KEY on the host; without the extra or the key it's off.
ask = ["anthropic>=1.15"]
# Animal identification in the monitor. SpeciesNet supports Python < 3.14 (and pins numpy < 2
# on Intel Macs); without it the monitor watches for motion only.
detect = ["speciesnet>=5.0.5; python_version < '3.14'"]

[project.scripts]
camera-mcp = "camera_mcp.server:main"
camera-monitor = "camera_mcp.monitor:main"
camera-backtest = "camera_mcp.gate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
